<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFW Betziesdorf Training</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#555;--card:#f4f1f0;--line:#d9d2d0;--accent:#b3141b;--accent-fg:#fff;--focus:#0b57d0}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f2f2;--muted:#bbb;--card:#222;--line:#3a3a3a;--accent:#ff5a5f;--accent-fg:#141414;--focus:#8ab4f8}}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
header{background:var(--accent);color:var(--accent-fg);padding:20px 16px}
header h1{margin:0 0 4px;font-size:1.5rem}
header p{margin:0}
main{max-width:720px;margin:0 auto;padding:16px}
ul{list-style:none;padding:0;margin:0}
li{margin:0 0 12px}
a.card{display:block;padding:16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);text-decoration:none;min-height:48px}
a.card:hover{border-color:var(--accent)}
a.card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.nr{display:block;color:var(--muted);font-size:.85rem}
.titel{display:block;font-weight:bold;font-size:1.15rem}
.bald{display:block;padding:16px;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}
footer{color:var(--muted);font-size:.85rem;margin-top:24px}
</style>
</head>
<body>
<header>
  <h1>FFW Betziesdorf</h1>
  <p>Trainingsseiten zum Nachüben auf dem Handy</p>
</header>
<main>
  <h2>Unterrichte</h2>
  <ul>
    <li><a class="card" href="01-strassenverkehr/"><span class="nr">Unterricht 1</span><span class="titel">Feuerwehr im Straßenverkehr</span></a></li>
    <li><span class="bald">Weitere Unterrichte folgen.</span></li>
  </ul>
  <footer>Freiwillige Feuerwehr Betziesdorf, Stadt Kirchhain</footer>
</main>
</body>
</html>
